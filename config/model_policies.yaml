# Model policies — OpenRouter multi-agent (ChatDev-style)
# Edit for your env. All agents billed via ONE OpenRouter key, different models per role.
# .env overrides per-role: MODEL_CEO, MODEL_CTO, MODEL_PROGRAMMER, etc. (highest priority)
# This file defines policies + fallback chains. Never hardcode in code.

policies:
  balanced:
    primary: "openrouter/auto"
    fallbacks: ["mock"]
    description: "General purpose balanced policy"

  backend_default:
    primary: "openrouter/anthropic/claude-3.5-sonnet"
    fallbacks: ["openrouter/openai/gpt-4o", "openrouter/qwen/qwen-2.5-coder-32b-instruct", "mock"]
    description: "Backend coding (Programmer via OpenRouter)"

  frontend_default:
    primary: "openrouter/anthropic/claude-3.5-sonnet"
    fallbacks: ["openrouter/openai/gpt-4o", "mock"]
    description: "Frontend coding"

  reasoning_heavy:
    primary: "openrouter/openai/gpt-4o"
    fallbacks: ["openrouter/anthropic/claude-3.5-sonnet", "mock"]
    description: "Complex reasoning / architecture (CEO/CTO)"

  fast:
    primary: "openrouter/google/gemini-2.0-flash-001"
    fallbacks: ["mock"]
    description: "Quick CPO/fast tasks"

  review:
    primary: "openrouter/openai/gpt-4o-mini"
    fallbacks: ["openrouter/qwen/qwen-2.5-coder-32b-instruct", "mock"]
    description: "Code review / security (Reviewer)"

  tester:
    primary: "openrouter/qwen/qwen-2.5-coder-32b-instruct"
    fallbacks: ["openrouter/openai/gpt-4o-mini", "mock"]
    description: "Testing (Tester)"

  emergency:
    primary: "mock"
    fallbacks: []
    description: "Emergency fallback - mock"

models:
  openrouter/auto:
    provider: openrouter
    context_length: 128000
    supports_tools: true
    description: "OpenRouter auto-routing"
  openrouter/anthropic/claude-3.5-sonnet:
    provider: openrouter
    context_length: 200000
    supports_tools: true
    description: "CEO/Programmer via Claude"
  openrouter/openai/gpt-4o:
    provider: openrouter
    context_length: 128000
    supports_tools: true
    description: "CTO/Reasoning via GPT-4o"
  openrouter/openai/gpt-4o-mini:
    provider: openrouter
    context_length: 128000
    supports_tools: true
    description: "Reviewer via GPT-4o-mini"
  openrouter/qwen/qwen-2.5-coder-32b-instruct:
    provider: openrouter
    context_length: 32768
    supports_tools: true
    description: "Tester/Coder via Qwen"
  openrouter/google/gemini-2.0-flash-001:
    provider: openrouter
    context_length: 1000000
    supports_tools: true
    description: "Fast/CPO via Gemini Flash"
  mock:
    provider: mock
    context_length: 32000
    supports_tools: true
    description: "Offline deterministic mock (no key needed)"
